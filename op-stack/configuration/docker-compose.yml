version: '3.8'

# ==============================================================================
# NairaTag Network — Actual OP Stack Local Devnet
# ==============================================================================
# Services:
#   1. ethereum-l1: Local Ethereum L1 settlement layer (Anvil / Geth)
#   2. l2-execution: op-geth / op-reth (NairaTag L2 execution engine)
#   3. op-node: OP Stack consensus/derivation client (Sequencer)
#   4. op-batcher: Publishes L2 transaction batches to Ethereum L1
#   5. op-proposer: Submits L2 state roots to Ethereum L1
# ==============================================================================

services:
  ethereum-l1:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: nairatag-ethereum-l1
    entrypoint: ["anvil"]
    command:
      - "--chain-id"
      - "900"
      - "--block-time"
      - "1"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8545"
      - "--accounts"
      - "10"
      - "--balance"
      - "10000"
    ports:
      - "8545:8545"
    networks:
      - nairatag-net

  l2-execution:
    image: us-docker.pkg.dev/oplabs-tools-data/images/op-geth:v1.101411.4
    container_name: nairatag-l2-execution
    depends_on:
      - ethereum-l1
    ports:
      - "9545:8545"   # Public L2 JSON-RPC
      - "8551:8551"   # Authenticated Engine API
    volumes:
      - ./jwt.hex:/config/jwt.hex:ro
      - ./genesis.json:/config/genesis.json:ro
      - l2_data:/data
    command:
      - "--datadir=/data"
      - "--http"
      - "--http.addr=0.0.0.0"
      - "--http.port=8545"
      - "--http.api=eth,net,web3,debug,txpool"
      - "--http.corsdomain=*"
      - "--http.vhosts=*"
      - "--authrpc.addr=0.0.0.0"
      - "--authrpc.port=8551"
      - "--authrpc.vhosts=*"
      - "--authrpc.jwtsecret=/config/jwt.hex"
      - "--nodiscover"
      - "--syncmode=full"
      - "--gcmode=archive"
      - "--networkid=901"
    networks:
      - nairatag-net

  op-node:
    image: us-docker.pkg.dev/oplabs-tools-data/images/op-node:v1.11.1
    container_name: nairatag-op-node
    depends_on:
      - ethereum-l1
      - l2-execution
    ports:
      - "8547:8545"   # op-node RPC
    volumes:
      - ./jwt.hex:/config/jwt.hex:ro
      - ./rollup.json:/config/rollup.json:ro
    command:
      - "--l1=http://ethereum-l1:8545"
      - "--l1.beacon-ignore"
      - "--l1.rpckind=basic"
      - "--l2=http://l2-execution:8551"
      - "--l2.jwt-secret=/config/jwt.hex"
      - "--rollup.config=/config/rollup.json"
      - "--sequencer.enabled"
      - "--sequencer.l1-confs=0"
      - "--verifier.l1-confs=0"
      - "--rpc.addr=0.0.0.0"
      - "--rpc.port=8545"
      - "--p2p.disable"
    networks:
      - nairatag-net

  op-batcher:
    image: us-docker.pkg.dev/oplabs-tools-data/images/op-batcher:v1.11.1
    container_name: nairatag-op-batcher
    depends_on:
      - ethereum-l1
      - op-node
      - l2-execution
    command:
      - "--l1-eth-rpc=http://ethereum-l1:8545"
      - "--l2-eth-rpc=http://l2-execution:8545"
      - "--rollup-rpc=http://op-node:8545"
      - "--poll-interval=1s"
      - "--sub-safety-margin=4"
      - "--num-confirmations=1"
      - "--safe-abort-nonce-too-low-count=3"
      - "--private-key=0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d"
    networks:
      - nairatag-net

  op-proposer:
    image: us-docker.pkg.dev/oplabs-tools-data/images/op-proposer:v1.11.1
    container_name: nairatag-op-proposer
    depends_on:
      - ethereum-l1
      - op-node
      - l2-execution
    command:
      - "--l1-eth-rpc=http://ethereum-l1:8545"
      - "--rollup-rpc=http://op-node:8545"
      - "--poll-interval=6s"
      - "--num-confirmations=1"
      - "--private-key=0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a"
      - "--l2oo-address=0x6900000000000000000000000000000000000000"
    networks:
      - nairatag-net

networks:
  nairatag-net:
    driver: bridge

volumes:
  l2_data:
