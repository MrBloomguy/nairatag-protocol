<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0C0D0E" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>NairaTag • Send USDC on Arc</title>
  <meta name="description"
    content="Send USDC on Arc to a human-readable NairaTag identity instead of a wallet address." />
  
  <!-- Favicon & Icons -->
  <link rel="icon" type="image/png" href="/nairatag-logo.png" />
  <link rel="apple-touch-icon" href="/nairatag-logo.png" />
  <link rel="manifest" href="/site.webmanifest" />
  
  <!-- Open Graph / Meta -->
  <meta property="og:title" content="NairaTag • Send USDC on Arc" />
  <meta property="og:description" content="Send USDC on Arc to a name, not an address." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://arc.nairatag.ng/" />
  <meta property="og:image" content="https://arc.nairatag.ng/nairatag-logo.png" />
  <meta name="twitter:title" content="NairaTag • Send USDC on Arc" />
  <meta name="twitter:description" content="Send USDC on Arc to a name, not an address." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@NairaTaghq" />
  <meta name="twitter:creator" content="@NairaTaghq" />
  <meta name="twitter:image" content="https://arc.nairatag.ng/nairatag-logo.png" />
  
  <style>
    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      overscroll-behavior-x: none;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    ::-webkit-scrollbar {
      display: none;
      width: 0px;
      height: 0px;
    }
    #app-splash {
      position: fixed;
      inset: 0;
      background: #0A0B0E;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.4s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .splash-card {
      width: 110px;
      height: 110px;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.8), 0 0 35px rgba(187, 242, 70, 0.25);
      animation: splashPulse 2.2s infinite ease-in-out;
      border: 1.5px solid rgba(255, 255, 255, 0.12);
    }
    .splash-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 4px;
      background: #000;
      display: block;
    }
    .splash-brand {
      margin-top: 22px;
      font-weight: 800;
      font-size: 20px;
      color: #FFFFFF;
      letter-spacing: -0.4px;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .splash-arc-pill {
      color: #BBF246;
      font-size: 12px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 999px;
      background: rgba(187, 242, 70, 0.14);
      border: 1px solid rgba(187, 242, 70, 0.3);
    }
    .splash-sub {
      margin-top: 8px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 500;
    }
    .splash-spinner {
      margin-top: 28px;
      width: 24px;
      height: 24px;
      border: 2.5px solid rgba(255, 255, 255, 0.12);
      border-top-color: #BBF246;
      border-radius: 50%;
      animation: splashSpin 0.75s linear infinite;
    }
    @keyframes splashPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes splashSpin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <!-- Native Splash Screen with New Brand Identity -->
  <div id="app-splash">
    <div class="splash-card">
      <img src="/splash-logo.png" alt="NairaTag Logo" />
    </div>
    <div class="splash-spinner"></div>
  </div>
  <script>
    (function() {
      function dismissSplash() {
        var s = document.getElementById('app-splash');
        if (s) {
          s.style.opacity = '0';
          s.style.visibility = 'hidden';
          s.style.pointerEvents = 'none';
          setTimeout(function() { if (s && s.parentNode) s.parentNode.removeChild(s); }, 400);
        }
      }
      setTimeout(dismissSplash, 600);
      window.addEventListener('load', function() { setTimeout(dismissSplash, 200); });
    })();
  </script>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
